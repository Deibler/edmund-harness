<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f1e8; --paper-2:#eae5d7; --ink:#17190f; --ink-2:#4c4f3e;
  --rule:#c6c0ae; --hot:#bf3f10; --field:#2c4526;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.62 "Source Serif 4",Georgia,"Times New Roman",serif}
h1,h2,h3,.lbl,.meta{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 22px}
a{color:var(--hot)}

.topbar{background:var(--ink);color:var(--paper);font:600 12px/1 Archivo,Arial,sans-serif;
  letter-spacing:.06em;padding:11px 0}
.topbar .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.topbar span{opacity:.72;font-weight:500}

header{padding:34px 0 26px;border-bottom:2px solid var(--ink)}
h1{margin:0 0 10px;font-size:clamp(30px,6vw,46px);line-height:1.06;font-weight:800;letter-spacing:-.01em}
.stand{margin:0;font-size:19px;color:var(--ink-2);max-width:58ch}

section{padding:30px 0;border-bottom:1px solid var(--rule)}
h2{margin:0 0 4px;font-size:25px;font-weight:700;letter-spacing:-.01em}
h3{margin:24px 0 6px;font-size:18px;font-weight:700}
p{margin:0 0 13px}
.sub{margin:0 0 16px;font:500 12px/1.4 Archivo,Arial,sans-serif;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-2)}

/* the repeated primitive: a ruled row, label left, value right */
.ledger{border-top:1px solid var(--ink);margin:14px 0 0}
.row{display:flex;gap:18px;justify-content:space-between;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--rule)}
.row .lbl{flex:0 0 auto;font:600 12px/1.5 Archivo,Arial,sans-serif;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-2)}
.row .val{text-align:right}
.row .val b{font-weight:700}

figure{margin:0}
.map{width:100%;display:block;border:1px solid var(--ink)}
figcaption{margin-top:8px;font:13px/1.5 Archivo,Arial,sans-serif;color:var(--ink-2)}

.leg{margin:18px 0 0;border-top:1px solid var(--ink)}
.leg .item{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--rule)}
.leg .n{flex:0 0 30px;font:800 20px/1.15 Archivo,Arial,sans-serif;color:var(--hot)}
.leg h3{margin:0 0 3px;font-size:17px}
.leg p{margin:0;color:var(--ink-2);font-size:16px}

.warn{background:var(--paper-2);border:1px solid var(--ink);padding:15px 17px;margin:18px 0 0}
.warn .lbl{display:block;font:700 12px/1.4 Archivo,Arial,sans-serif;letter-spacing:.07em;
  text-transform:uppercase;margin-bottom:5px}
.warn p{margin:0;font-size:16px}

.src{font:13px/1.55 Archivo,Arial,sans-serif;color:var(--ink-2)}
.src b{font-weight:700;letter-spacing:.06em}
.coords{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px}

footer{padding:26px 0 44px;color:var(--ink-2);font:13px/1.6 Archivo,Arial,sans-serif}
@media print{.topbar{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
  <div>{{KICKER}}</div><span>{{DATED}}</span>
</div></div>

<header><div class="wrap">
  <h1>{{TRAIL_NAME}}</h1>
  <p class="stand">{{STANDFIRST}}</p>
</div></header>

<section><div class="wrap">
  <p class="sub">At a glance</p>
  <div class="ledger">{{GLANCE_ROWS}}</div>
</div></section>

<section><div class="wrap">
  <h2>The map</h2>
  <p class="sub">{{MAP_SUB}}</p>
  <figure>
    <img class="map" src="{{MAP_IMAGE}}" alt="Topographic map of {{TRAIL_NAME}} with the route traced">
    <figcaption>{{MAP_CAPTION}}</figcaption>
  </figure>
</div></section>

<section><div class="wrap">
  <h2>What changes along the way</h2>
  <p class="sub">Ordered as you walk it</p>
  <div class="leg">{{LEGS}}</div>
</div></section>

<section><div class="wrap">
  <h2>Getting there</h2>
  <div class="ledger">{{ACCESS_ROWS}}</div>
  {{WARNINGS}}
</div></section>

{{EXTRA_SECTIONS}}

<section><div class="wrap">
  <h2>Where this came from</h2>
  <div class="src">{{SOURCES}}</div>
</div></section>

<footer><div class="wrap">{{FOOTER}}</div></footer>

</body>
</html>
