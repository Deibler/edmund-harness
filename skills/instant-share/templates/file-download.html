<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download: {{FILENAME}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #111111;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .file-icon {
      width: 64px;
      height: 80px;
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .file-icon::after {
      content: '{{FILE_EXT}}';
      font-size: 12px;
      font-weight: 600;
      color: #666666;
      text-transform: uppercase;
    }
    .file-icon::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 16px 16px 0;
      border-color: transparent #f5f5f5 transparent transparent;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .file-meta {
      color: #666666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .file-meta span {
      display: inline-block;
    }
    .file-meta span + span::before {
      content: ' | ';
      color: #e0e0e0;
      margin: 0 8px;
    }
    .description {
      text-align: left;
      background: #fafafa;
      padding: 16px;
      border-radius: 4px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #666666;
    }
    .description p {
      margin: 0;
    }
    .download-btn {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      padding: 14px 32px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .download-btn:hover {
      background: #333333;
    }
    .expires {
      margin-top: 24px;
      font-size: 13px;
      color: #999999;
    }
    .checksum {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eeeeee;
      font-size: 12px;
      color: #999999;
    }
    .checksum code {
      display: block;
      background: #f5f5f5;
      padding: 8px;
      border-radius: 4px;
      margin-top: 8px;
      font-family: 'SF Mono', Monaco, monospace;
      word-break: break-all;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="file-icon"></div>
    <h1>{{FILENAME}}</h1>
    <div class="file-meta">
      <span>{{FILE_SIZE}}</span>
      <span>{{FILE_TYPE}}</span>
    </div>
    
    {{#DESCRIPTION}}
    <div class="description">
      <p>{{DESCRIPTION}}</p>
    </div>
    {{/DESCRIPTION}}
    
    <a href="{{DOWNLOAD_URL}}" class="download-btn" download="{{FILENAME}}">Download File</a>
    
    {{#EXPIRES}}
    <p class="expires">Link expires {{EXPIRES}}</p>
    {{/EXPIRES}}
    
    {{#CHECKSUM}}
    <div class="checksum">
      SHA-256 Checksum
      <code>{{CHECKSUM}}</code>
    </div>
    {{/CHECKSUM}}
    
    {{#ADMIN_URL}}<div style="margin-top: 20px; text-align: center;"><a href="{{ADMIN_URL}}" style="color: #999; font-size: 12px;">Admin</a></div>{{/ADMIN_URL}}
  </div>
</body>
</html>
