name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The harness depends on imcore-bridge by relative path, so CI checks the
# two repositories out side by side and builds the bridge's TypeScript
# client. The dylib itself needs a Mac with SIP off and is never built here.
jobs:
  checks:
    name: typecheck, lint, tests
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: edmund-harness
    steps:
      - uses: actions/checkout@v7
        with:
          path: edmund-harness
      - name: Check out imcore-bridge beside it
        uses: actions/checkout@v7
        with:
          repository: Deibler/imcore-bridge
          path: imcore-bridge
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build the imcore-bridge client
        working-directory: imcore-bridge
        run: npm ci && npm run build:ts
      - name: Install
        run: bun install --frozen-lockfile
      # config.toml is gitignored (it holds keys), and several tests load it.
      # The example is the documented starting point and the right CI baseline:
      # placeholder keys, every optional subsystem off.
      - name: Configure
        run: cp config.example.toml config.toml
      - name: Typecheck
        run: bun run typecheck
      - name: Lint and format
        run: bun run lint
      - name: Tests
        run: bun test tests/ integrations/kitchen/test
      # The two front ends have their own package.json and lockfile and are
      # not part of the root install, so nothing typechecked them until a
      # dependency bump broke a build nobody ran. They are built here.
      - name: Operator dashboard
        working-directory: edmund-harness/dashboard/web
        run: bun install --frozen-lockfile && bunx tsc --noEmit && bun run build
      - name: User portal
        working-directory: edmund-harness/dashboard/user-web
        run: bun install --frozen-lockfile && bunx tsc --noEmit && bun run build
      - name: Unused code (advisory until the backlog is cleared)
        run: bun run knip
        continue-on-error: true

  audit:
    name: dependency audit
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edmund-harness
    steps:
      - uses: actions/checkout@v7
        with:
          path: edmund-harness
      - uses: actions/checkout@v7
        with:
          repository: Deibler/imcore-bridge
          path: imcore-bridge
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Audit (high and critical advisories fail the build)
        run: bun run audit
