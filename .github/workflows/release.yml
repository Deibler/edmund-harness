name: Release

# Changesets flow for a package that is versioned and tagged but not
# published to npm: every merged change carries a .changeset entry; this
# workflow keeps a "Version packages" pull request open that bumps
# package.json and CHANGELOG.md; merging that pull request tags the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency: release-${{ github.ref }}

jobs:
  version:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edmund-harness
    steps:
      - uses: actions/checkout@v7
        with:
          path: edmund-harness
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: Deibler/imcore-bridge
          path: imcore-bridge
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Version pull request, or tag the release
        uses: changesets/action@v1
        with:
          cwd: edmund-harness
          version: bun run version
          publish: bun run release
          commit: "Version packages"
          title: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
