version: 2

# Security updates arrive separately and are never ignored here; these are
# routine version updates. Minor and patch bumps are grouped into one pull
# request per ecosystem so a normal week is one review, not fifteen. Majors
# that need a coordinated migration are ignored by name, with the reason, so
# they stop reopening every week; delete the entry when you do the work.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # zod 4 is a rewrite of the schema API: the config schema and every MCP
      # tool schema would need porting (701 type errors on a trial bump).
      - dependency-name: zod
        update-types: [version-update:semver-major]
      # Biome 2 turns on new rules by default: 250 findings, and the automated
      # fixes are not all safe (one introduced a type error in the credits
      # code on a trial run). Worth doing as its own reviewed change.
      - dependency-name: "@biomejs/biome"
        update-types: [version-update:semver-major]
      # The MCP SDK 1.30 deprecates the positional tool() overloads and its
      # zod-3 compatibility types reject the ghost server's schema. The
      # dependency is pinned to ~1.29.0 until that migration is done
      # deliberately.
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: npm
    directory: /dashboard/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # React 19 is a coordinated migration across both front ends; the types
      # packages must move with the runtime, not ahead of it.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      # react-window 2 is a different API; the types cannot lead the library.
      - dependency-name: react-window
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-window"
        update-types: [version-update:semver-major]
      # Tailwind 4 replaces the config file with CSS-first configuration.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # React Router 7 changes runtime routing behaviour and nothing here
      # exercises the dashboard's routes, so a clean build proves too little.
      # Take it with a smoke test, not on its own.
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /dashboard/user-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
