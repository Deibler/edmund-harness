version: 2

# Security updates arrive separately and are never ignored here; these are
# routine version updates. Minor and patch bumps are grouped into one pull
# request per ecosystem so a normal week is one review, not fifteen. Majors
# that need a coordinated migration are ignored by name, with the reason, so
# they stop reopening every week; delete the entry when you do the work.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # zod 4 is a rewrite of the schema API: the config schema and every MCP
      # tool schema would need porting (701 type errors on a trial bump).
      - dependency-name: zod
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /dashboard/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # React 19 is a coordinated migration across both front ends; the types
      # packages must move with the runtime, not ahead of it.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      # react-window 2 is a different API; the types cannot lead the library.
      - dependency-name: react-window
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-window"
        update-types: [version-update:semver-major]
      # Tailwind 4 replaces the config file with CSS-first configuration.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /dashboard/user-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      # @vitejs/plugin-react 6 fails to build against Vite 6; it moves when
      # Vite does.
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
